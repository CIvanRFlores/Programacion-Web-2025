<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar fondo con onclick</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <button class="red" onclick="document.body.style.backgroundColor='red'">Rojo</button>
        <button class="green" onclick="document.body.style.backgroundColor='green'">Verde</button>
        <button class="blue" onclick="document.body.style.backgroundColor='blue'">Azul</button>
        <button class="reset" onclick="document.body.style.backgroundColor='white'">Restablecer</button>
    </div>
</body>
</html>
