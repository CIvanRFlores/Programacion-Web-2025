<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar color con event delegation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container">
        <button class="red" data-color="red">Rojo</button>
        <button class="green" data-color="green">Verde</button>
        <button class="blue" data-color="blue">Azul</button>
        <button class="reset" data-color="reset">Restablecer</button>
    </div>
    <script>
        const contenedor = document.getElementById('container');
        contenedor.addEventListener('click', function(e) {
            if(e.target.tagName === 'BUTTON') {
                const color = e.target.dataset.color;
                document.body.style.backgroundColor = (color === 'reset') ? 'white' : color;
            }
        });
    </script>
</body>
</html>
