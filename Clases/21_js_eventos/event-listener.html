<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar color con event listener</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <button class="red" id="red">Rojo</button>
        <button class="green" id="green">Verde</button>
        <button class="blue" id="blue">Azul</button>
        <button class="reset" id="reset">Restablecer</button>
    </div>
    <script>
        const botones = document.querySelectorAll('button');

        botones.forEach(boton => {
            boton.addEventListener('click', function () {
                if(this.id === 'reset'){
                    document.body.style.backgroundColor = 'white';
                } else {
                    document.body.style.backgroundColor = this.id;
                }
            })
        })
    </script>
</body>
</html>
