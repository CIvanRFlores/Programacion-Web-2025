<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div id="calculator" class="calculator-body">
            <input id="screen" class="calculator-display" value="|" disabled>
            <div class="calculator-btns">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>/</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>*</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>-</button>
                <button>0</button>
                <button>=</button>
                <button>C</button>
                <button>+</button>
            </div>
        </div>
        <div class="record-body">
            <h3 style="cursor: default;">| Historial |</h3>
            <div id="list">
                <textarea name="list" id="record" rows="22" cols="50" readonly></textarea>
            </div>
        </div>
    </main>

    <script type="module" src="./js/ui.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
